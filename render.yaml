services:
  - type: web
    name: kepce
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT
        value: "3"
      - key: JOBS_PER_HOUR
        value: "15"
      - key: JOB_TTL_MINUTES
        value: "30"
